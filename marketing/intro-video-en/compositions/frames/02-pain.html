      tl.fromTo(word,
        { xPercent: -50, yPercent: -50, scale: 1.25, opacity: 1 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);

      // Scene 2 (0.4-2.6): waterfall-entry — binary opacity via set, whip up from below, power4.out.

      var t = 0.4;
      var gap = 0.15;
      crowd.forEach(function (el, i) {
        var heavy = el.classList.contains("pain02-win");
        var travel = heavy ? 80 : (i % 3 === 0 ? 50 : 42);
        var dur = heavy ? 0.2 : (i % 3 === 0 ? 0.16 : 0.14);

        tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, t);
        t += gap;
        gap = Math.max(0.12, gap - 0.003);
      });

      // Scene 3 (2.6-3.15): everything closes in toward the centre in lockstep (inverse expansion),
      // overlapping and dimming to ~35%; "publish" is buried underneath.
      var CLOSE_AT = 2.6, CLOSE_DUR = 0.55, PULL = 0.52;
      crowd.forEach(function (el) {
        var dx = (CX - Number(el.dataset.x)) * PULL;
        var dy = (CY - Number(el.dataset.y)) * PULL;
        tl.to(el, { x: dx, y: dy, scale: 0.94, opacity: 0.35, duration: CLOSE_DUR, ease: "power3.out" }, CLOSE_AT);
      });
      tl.to(word, { scale: 0.9, opacity: 0.12, duration: CLOSE_DUR, ease: "power3.out" }, CLOSE_AT);

      // Scene 4 (3.15-4.0): kinetic-beat-slam — headline slams in over the dimmed crowd, then holds still.
      tl.fromTo(headline,
        { scale: 1.45, filter: "blur(16px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "power4.out" }, 3.15);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-pain"] = tl;
    })();
  </script>
