          <div class="f04init-line f04init-out">
            <svg class="f04init-check" viewBox="0 0 20 20"><polyline points="3,10.5 8,15.5 17,4.5" /></svg>
            <span class="f04init-label">framework</span><span class="f04init-val">flutter</span>
          </div>
          <div class="f04init-line f04init-out">
            <svg class="f04init-check" viewBox="0 0 20 20"><polyline points="3,10.5 8,15.5 17,4.5" /></svg>
            <span class="f04init-label">bundle id</span><span class="f04init-val">com.you.app</span>
          </div>
          <div class="f04init-line f04init-out">
            <svg class="f04init-check" viewBox="0 0 20 20"><polyline points="3,10.5 8,15.5 17,4.5" /></svg>
            <span class="f04init-label">package</span><span class="f04init-val">com.you.app</span>
          </div>
          <div class="f04init-line f04init-out">
            <svg class="f04init-check" viewBox="0 0 20 20"><polyline points="3,10.5 8,15.5 17,4.5" /></svg>
            <span class="f04init-cyan">release/</span>&nbsp;<span class="f04init-ok">created</span>
          </div>
          <div class="f04init-gap"></div>

          <!-- release/ tree -->
          <div class="f04init-line f04init-tree">
            <span class="f04init-tree-root">release/</span>

          <div class="f04init-line f04init-tree">
            <span class="f04init-hlfill" id="f04init-hlfill"></span>
            <span class="f04init-hlbar" id="f04init-hlbar"></span>
            <span class="f04init-br"></span><span class="f04init-hltext">release.yml</span>
          </div>
          <div class="f04init-line f04init-tree">
            <span class="f04init-br"></span><span>questionnaire.yml</span>

            <span class="f04init-br f04init-last"></span>
            <span class="f04init-dirs"><span>ios/</span><span>android/</span><span>metadata/</span></span>
          </div>

          <!-- fresh prompt for the hold -->
          <div class="f04init-line" id="f04init-prompt2">
            <span class="f04init-prompt">$</span>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const DURATION = 3.5;
        const root = document.querySelector('[data-composition-id="04-init"]');
        const $ = (id) => document.getElementById(id);
        const $$ = (sel) => Array.prototype.slice.call(root.querySelectorAll(sel));

        const tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0–0.6): kicker, per-word h2, terminal slides in ----
        tl.fromTo($('f04init-rule'), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power3.out' }, 0);
        tl.fromTo(
          $('f04init-kicker'),
          { opacity: 0, x: -24 },
          { opacity: 1, x: 0, duration: 0.3, ease: 'power3.out' },
          0.02,
        );
        tl.fromTo(
          $$('.f04init-word'),
          { yPercent: 105, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.34, ease: 'power3.out', stagger: 0.055 },
          0.1,
        );
        tl.fromTo(
          $('f04init-term'),
          { x: 320, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.5, ease: 'expo.out' },
          0.04,
        );

        // Slow push-in under the whole shot (one camera move, decelerating)
        tl.fromTo($('f04init-world'), { scale: 1 }, { scale: 1.025, duration: DURATION, ease: 'sine.out' }, 0);

        // ---- Scene 2 (0.6–1.3): "appship init" types (smooth slice) + caret ----
        // ---- Caret blink: deterministic square wave on the same driver ----
        const CMD = 'appship init';
        const TYPE_START = 0.62;
        const TYPE_END = 1.12; // 12 chars in 0.5s = 24 chars/s
        const ENTER_AT = 1.24;
        const PROMPT2_AT = 3.0;
        const cmdEl = $('f04init-cmd');
        const caret1 = $('f04init-caret1');
        const caret2 = $('f04init-caret2');
        let lastLen = -1;

        function typedLen(t) {
          if (t <= TYPE_START) return 0;
          if (t >= TYPE_END) return CMD.length;
          return Math.floor(((t - TYPE_START) / (TYPE_END - TYPE_START)) * CMD.length);
        }
        function blinkOn(t) {
          return Math.sin((t / 0.6) * Math.PI * 2) >= 0;
        }

        const driver = { t: 0 };
        function render() {
          const t = driver.t;
          const n = typedLen(t);
          if (n !== lastLen) {
            cmdEl.textContent = CMD.substring(0, n);
            lastLen = n;
          }
          // caret 1: solid while typing, blinking before, gone after Enter
          if (t >= ENTER_AT) caret1.style.opacity = '0';
          else if (t >= TYPE_START - 0.05) caret1.style.opacity = '1';
          else caret1.style.opacity = blinkOn(t) ? '1' : '0';
          // caret 2: fresh prompt in the hold, blinking
          caret2.style.opacity = t >= PROMPT2_AT && blinkOn(t - PROMPT2_AT) ? '1' : '0';
        }
        render();
        tl.to(driver, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: render }, 0);

        // ---- Scene 3 (1.3–2.6): detection lines drop in one by one ----
        const outs = $$('.f04init-out');
        outs.forEach(function (el, i) {
          const at = 1.3 + i * 0.25;
          tl.fromTo(el, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out' }, at);
          const check = el.querySelector('.f04init-check');
          tl.fromTo(
            check,
            { scale: 0.4 },
            { scale: 1, duration: 0.24, ease: 'back.out(2.4)', transformOrigin: '50% 50%' },
            at,
          );
        });

        // ---- Scene 4 (2.55–3.5): release/ tree prints, release.yml highlighted, hold ----
        const trees = $$('.f04init-tree');
        trees.forEach(function (el, i) {
          tl.fromTo(
            el,
            { opacity: 0, x: -12 },
            { opacity: 1, x: 0, duration: 0.15, ease: 'power2.out' },
            2.55 + i * 0.07,
          );
        });
        tl.fromTo($('f04init-hlbar'), { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: 'power3.out' }, 2.78);
        tl.fromTo($('f04init-hlfill'), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power3.out' }, 2.8);
        tl.fromTo($('f04init-prompt2'), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'none' }, PROMPT2_AT);

        window.__timelines = window.__timelines || {};
        window.__timelines['04-init'] = tl;
      })();
    </script>
  </div>
</template>
