<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e4ecf3;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
      ></div>

      <div
        id="el-02-pain"
        class="scene"
        data-composition-id="02-pain"
        data-composition-src="compositions/frames/02-pain.html"
        data-start="3"
        data-duration="4.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-intro"
        class="scene"
        data-composition-id="03-intro"
        data-composition-src="compositions/frames/03-intro.html"
        data-start="7"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-init"
        class="scene"
        data-composition-id="04-init"
        data-composition-src="compositions/frames/04-init.html"
        data-start="10"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-questionnaire"
        class="scene"
        data-composition-id="05-questionnaire"
        data-composition-src="compositions/frames/05-questionnaire.html"
        data-start="13.5"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-doctor"
        class="scene"
        data-composition-id="06-doctor"
        data-composition-src="compositions/frames/06-doctor.html"
        data-start="17"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-ship"
        class="scene"
        data-composition-id="07-ship"
        data-composition-src="compositions/frames/07-ship.html"
        data-start="20.5"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-benefits"
        class="scene"
        data-composition-id="08-benefits"
        data-composition-src="compositions/frames/08-benefits.html"
        data-start="24"
        data-duration="3.4"
        data-track-index="1"
      ></div>

      <div
        id="el-09-cta"
        class="scene"
        data-composition-id="09-cta"
        data-composition-src="compositions/frames/09-cta.html"
        data-start="27"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <!-- Offline-synthesized music bed + SFX (scripts/make-audio.py), one mixed track. -->
      <audio
        id="sound-mix"
        src="assets/audio/mix.wav"
        data-start="0"
        data-duration="30.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-pain", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 7);
        tl.fromTo("#el-03-intro", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 7);
        tl.to("#el-03-intro", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.fromTo("#el-04-init", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.to("#el-05-questionnaire", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.fromTo("#el-06-doctor", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.to("#el-08-benefits", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 27);
        tl.fromTo("#el-09-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 27);
        tl.to({}, { duration: 30.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
