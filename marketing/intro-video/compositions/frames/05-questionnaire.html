      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector('[data-composition-id="05-questionnaire"] ' + s);
      const qa = (s) => document.querySelectorAll('[data-composition-id="05-questionnaire"] ' + s);

      // Scene 1 (0.0–0.7): kicker + rule, then per-word headline rise
      tl.fromTo(q('#q05-kicker'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0);
      tl.fromTo(q('#q05-rule'), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power3.out' }, 0.05);
      tl.fromTo(qa('.q05-word'), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.34, ease: 'power3.out', stagger: 0.045 }, 0.1);

      // Scene 2 (0.65–1.4): split-tilt entry from opposite wings, flattening side by side
      tl.fromTo(q('#q05-panel-left'),
        { x: -380, rotationY: 22, scale: 0.88, opacity: 0, transformOrigin: '100% 50%' },
        { x: 0, rotationY: 0, scale: 1, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.65);
      tl.fromTo(q('#q05-panel-right'),
        { x: 380, rotationY: -22, scale: 0.88, opacity: 0, transformOrigin: '0% 50%' },
        { x: 0, rotationY: 0, scale: 1, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.8);
      tl.fromTo(q('#q05-divider'), { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: 'power2.out' }, 0.9);

      // Counter-phase idle on the outer wing layer (separate from the entry layer)
      tl.fromTo(q('#q05-wing-left'), { y: 0 }, { y: -4, duration: 1.05, ease: 'sine.inOut' }, 1.4);
      tl.to(q('#q05-wing-left'), { y: 0, duration: 1.05, ease: 'sine.inOut' }, 2.45);
      tl.fromTo(q('#q05-wing-right'), { y: 0 }, { y: 4, duration: 1.05, ease: 'sine.inOut' }, 1.4);
      tl.to(q('#q05-wing-right'), { y: 0, duration: 1.05, ease: 'sine.inOut' }, 2.45);

      // Scene 3 (1.4–2.45): rows fill alternately, pre-computed sequence (left ✓, right → copy)
      const ROWS = [
        { row: '#q05-l1', mark: '#q05-c1', side: -1 },
        { row: '#q05-r1', mark: '#q05-k1', side: 1 },
        { row: '#q05-l2', mark: '#q05-c2', side: -1 },
        { row: '#q05-r2', mark: '#q05-k2', side: 1 },
        { row: '#q05-l3', mark: '#q05-c3', side: -1 },
        { row: '#q05-r3', mark: '#q05-k3', side: 1 },
      ];
      const ROW_START = 1.4;
      const ROW_STEP = 0.16;
      const SEQ = ROWS.map((r, i) => ({ ...r, start: ROW_START + i * ROW_STEP }));
      SEQ.forEach((r) => {
        tl.fromTo(q(r.row), { opacity: 0, x: 24 * r.side }, { opacity: 1, x: 0, duration: 0.24, ease: 'power3.out' }, r.start);
        tl.fromTo(q(r.mark), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: 'back.out(2)' }, r.start + 0.1);
      });

      // Scene 4 (2.5–3.5): inner-edge pills spring-pop, then hold
      tl.fromTo(q('#q05-pill-left'), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.7)' }, 2.5);
      tl.fromTo(q('#q05-pill-right'), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.7)' }, 2.6);

      // Pad to the full frame duration
      tl.set({}, {}, 3.5);

      window.__timelines['05-questionnaire'] = tl;
    })();
  </script>
</template>
