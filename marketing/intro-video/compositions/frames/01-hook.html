  <script>
    (function () {
      const TOTAL = 3;
      const tl = gsap.timeline({ paused: true });

      // ---- Scene 1: per-word staggered reveal of the headline ----
      const words = gsap.utils.toArray("#hook-01-headline .hook-01-word");
      words.forEach((w, i) => {
        tl.fromTo(
          w,
          { opacity: 0, y: 40, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power4.out" },
          0.04 + i * 0.07
        );
      });

      // ---- Scene 1: terminal chip appears, types "flutter run", green check snaps ----
      tl.fromTo(
        "#hook-01-chip",
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.18, ease: "expo.out" },
        0.4
      );

      const T_DONE = 0.72;
      const SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.44, text: "f" },
        { t: 0.48, text: "flu" },
        { t: 0.52, text: "flutt" },
        { t: 0.56, text: "flutter" },
        { t: 0.6, text: "flutter r" },
        { t: 0.64, text: "flutter run" },
      ];
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      const textEl = document.getElementById("hook-01-text");
      const caretEl = document.getElementById("hook-01-caret");
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate: () => {
            textEl.textContent = textAt(driver.t);
            // caret: solid while typing, sin-wave blink before, hidden once the check lands
            if (driver.t >= T_DONE) {
              caretEl.style.opacity = "0";
            } else if (driver.t >= 0.44) {
              caretEl.style.opacity = "1";
            } else {
              caretEl.style.opacity = Math.sin(driver.t * Math.PI * 2 * 2.5) > 0 ? "1" : "0";
            }
          },
        },
        0
      );

      tl.fromTo(
        "#hook-01-check",
        { opacity: 0, scale: 0.2 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.6)" },
        T_DONE
      );

      // ---- Scene 2: hard cut, display slam (scale-down from oversized to rest) ----
      const S2 = 1.3;
      tl.fromTo(
        "#hook-01-line1",
        { scale: 1.7, opacity: 0, filter: "blur(18px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
        S2
      );
      tl.fromTo(
        "#hook-01-line2",
        { scale: 2.1, opacity: 0, filter: "blur(22px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
        S2 + 0.12
      );

      // ellipsis dots appear one by one (discrete, ~0.15s apart)
      const DOTS = ["#hook-01-dot1", "#hook-01-dot2", "#hook-01-dot3"];
      DOTS.forEach((d, i) => {
        tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 1.78 + i * 0.15);
      });
      // then holds still to the end (no exit)

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
