  <script>
    (function () {
      const DUR = 3;
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="03-intro"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));

      // One beat grid drives every reveal (fast tempo, silent frame).
      const BEATS = [0.05, 0.9, 1.7, 2.15];

      // Kicker built as per-char spans for a deterministic type-on.
      const kicker = q("#intro-03-kicker");
      const KICKER = "APPSHIP-AI · CLI · CHẠY TRÊN FASTLANE";
      const chars = Array.from(KICKER).map((c) => {
        const s = document.createElement("span");
        s.textContent = c;
        kicker.appendChild(s);
        return s;
      });
      const caret = document.createElement("span");
      caret.className = "intro-03-caret";
      kicker.appendChild(caret);

      // Macro move: slow push on the whole stage underneath every beat.
      tl.fromTo(q("#intro-03-stage"), { scale: 1 }, { scale: 1.035, duration: DUR, ease: "none" }, 0);

      // Scene 1: wordmark slams in from oversized to rest; the dot snaps a beat later.
      tl.fromTo(
        q("#intro-03-wordmark"),
        { scale: 1.7, opacity: 0, filter: "blur(18px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        BEATS[0]
      );
      tl.fromTo(
        q("#intro-03-dot"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" },
        BEATS[0] + 0.5
      );

      // Scene 2: rule stub draws left to right, mono kicker types on beside it.
      tl.fromTo(q("#intro-03-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "expo.out" }, BEATS[1]);
      tl.set(chars, { display: "none" }, 0);
      tl.set(caret, { opacity: 0 }, 0);
      tl.set(caret, { opacity: 1 }, BEATS[1] + 0.1);
      const typeStart = BEATS[1] + 0.12;
      const step = 0.014;
      chars.forEach((c, i) => tl.set(c, { display: "inline" }, typeStart + i * step));
      const typeEnd = typeStart + chars.length * step;
      // Caret blinks after typing, then hides (discrete, seek-safe).
      tl.set(caret, { opacity: 0 }, typeEnd + 0.12);
      tl.set(caret, { opacity: 1 }, typeEnd + 0.24);
      tl.set(caret, { opacity: 0 }, typeEnd + 0.36);

      // Scene 3: lead line reveals per word, then the mono sub-line snaps in. Holds.
      tl.fromTo(
        qa("#intro-03-lead .intro-03-word"),
        { y: 48, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "circ.out", stagger: 0.055 },
        BEATS[2]
      );
      tl.fromTo(
        q("#intro-03-sub"),
        { x: -60, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" },
        BEATS[3]
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-intro"] = tl;
    })();
  </script>
