  <script>
    (function () {
      const FRAME_ID = "09-cta";
      const DURATION = 3.5;
      const root = document.querySelector('[data-composition-id="09-cta"]');
      const q = (sel) => root.querySelector(sel);
      const qa = (sel) => Array.prototype.slice.call(root.querySelectorAll(sel));

      const rule = q('[id="cta09-rule"]');
      const words = qa('[class~="cta09-word"]');
      const block = q('[id="cta09-block"]');
      const textEl = q('[id="cta09-text"]');
      const cursorEl = q('[id="cta09-cursor"]');
      const url = q('[id="cta09-url"]');
      const sub = q('[id="cta09-sub"]');

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.8s): headline lands per-word, fast, left-anchored.
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.0);
      tl.fromTo(
        words,
        { opacity: 0, y: 70 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.09 },
        0.05,
      );

      // Scene 2 (0.8–2.0s): ink block slides up beneath, command types on.
      tl.fromTo(
        block,
        { opacity: 0, y: 80 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        0.8,
      );

      // discrete-text-sequence: baked keystroke schedule (pauses at word breaks).
      const COMMAND = "npm i -g appship-ai";
      const T_TYPE_START = 1.08;
      const STEP = 0.038;
      const WORD_PAUSE = 0.05;
      const SEQUENCE = [{ t: 0, text: "" }];
      let t = T_TYPE_START;
      for (let i = 1; i <= COMMAND.length; i++) {
        SEQUENCE.push({ t: t, text: COMMAND.slice(0, i) });
        t += STEP + (COMMAND.charAt(i - 1) === " " ? WORD_PAUSE : 0);
      }
      const T_DONE = SEQUENCE[SEQUENCE.length - 1].t;

      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      // context-sensitive-cursor: solid while typing, then a deterministic
      // whole-cycle cos blink that ends ON (last frame shows the caret).
      const BLINK_START = T_DONE + 0.2;
      const BLINK_SPAN = DURATION - BLINK_START;
      const BLINK_CYCLES = Math.max(1, Math.round(BLINK_SPAN / 0.7));

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            const now = driver.t;
            textEl.textContent = textAt(now);
            let on = true;
            if (now >= BLINK_START) {
              const p = ((now - BLINK_START) / BLINK_SPAN) * Math.PI * 2 * BLINK_CYCLES;
              on = Math.cos(p) > 0;
            }
            cursorEl.style.opacity = on ? "1" : "0";
          },
        },
        0,
      );

      // Scene 3 (2.0–2.8s): URL and sub-line reveal beneath.
      tl.fromTo(url, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 2.0);
      tl.fromTo(sub, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 2.2);

      // Scene 4 (2.8–3.5s): final still hold; only the caret blinks (driver above).

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
