    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // One tempo grid drives every beat (kinetic-beat-slam): 5 beats x 0.6s, hard cuts via clip windows.
      const PULSE = 0.6;
      const BEATS = [0, PULSE, PULSE * 2, PULSE * 3, PULSE * 4];
      const HIT = 0.22; // short attack so each phrase is readable for most of its beat

      // Beat 1: scale-down slam with blur (power4.out)

        { scale: 1.45, opacity: 0.2, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: HIT, ease: "power4.out" },

      // Beat 2: side snap + small scale-down (expo.out)
      tl.fromTo("#b08-p2",
        { x: -260, scale: 1.15, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: HIT, ease: "expo.out" },
        BEATS[1]);

      // Beat 3: rise + rotate settle with scale-down (circ.out)
      tl.fromTo("#b08-p3",
        { y: 90, rotation: 4, scale: 1.2, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: HIT + 0.04, ease: "circ.out" },
        BEATS[2]);

      // Beat 4: wide horizontal squash collapsing while scaling down (back.out overshoot)
      tl.fromTo("#b08-p4",
        { scaleX: 1.45, scaleY: 1.2, opacity: 0 },
        { scaleX: 1, scaleY: 1, opacity: 1, duration: HIT + 0.04, ease: "back.out(1.6)" },
        BEATS[3]);

      // Beat 5 (final): heaviest slam, underline draws, then a quiet settle (no exit)
      tl.fromTo("#b08-p5",
        { scale: 1.6, opacity: 0, filter: "blur(18px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: HIT, ease: "power4.out" },
        BEATS[4]);
      tl.fromTo("#b08-u5",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.24, ease: "expo.out" },
        BEATS[4] + 0.14);
      tl.fromTo("#b08-p5",
        { scale: 1 },
        { scale: 1.015, duration: 3 - BEATS[4] - HIT, ease: "sine.out", immediateRender: false },
        BEATS[4] + HIT);

      window.__timelines["08-benefits"] = tl;
    })();
