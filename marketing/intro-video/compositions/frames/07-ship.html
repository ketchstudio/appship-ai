          <div class="ship07-line" id="ship07-l3"><span class="ship07-ps">$ </span><span class="ship07-caret" id="ship07-c3"></span></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const scope = document.querySelector('[data-composition-id="07-ship"]') || document;
        const q = (s) => scope.querySelector(s);
        const qa = (s) => Array.from(scope.querySelectorAll(s));

        // Split each typed command into per-character spans (revealed by discrete sets).
        qa(".ship07-typed").forEach((el) => {
          const text = el.getAttribute("data-text");
          el.textContent = "";
          for (const c of text) {
            const s = document.createElement("span");
            s.className = "ship07-ch";
            s.textContent = c;
            el.appendChild(s);
          }
        });

        const tl = gsap.timeline({ paused: true });

        // Typing: one discrete display set per character.
        function typeOn(lineSel, start, end) {
          const chars = qa(lineSel + " .ship07-ch");
          const step = (end - start) / chars.length;
          chars.forEach((c, i) => tl.set(c, { display: "inline" }, start + i * step));
        }
        // Deterministic caret blink via discrete sets (no repeat/yoyo).
        function blink(caret, start, end, period) {
          let on = true;
          for (let t = start; t < end - 0.001; t += period / 2) {
            tl.set(caret, { opacity: on ? 1 : 0 }, t);
            on = !on;
          }
        }
        // Result line drop-in.
        function dropIn(sel, at) {
          tl.fromTo(q(sel), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, at);
        }

        // Scene 1 (0.0-0.5): headline per-word, terminal already present.
        tl.fromTo(q(".ship07-rule"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 0);
        tl.fromTo(q("#ship07-kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.02);
        tl.fromTo(qa("#ship07-h2 .ship07-w"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.04 }, 0.06);
        tl.fromTo(q("#ship07-termwrap"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05);
        // One slow continuous push-in on the terminal under the whole shot.
        tl.fromTo(q("#ship07-term"), { scale: 1 }, { scale: 1.025, duration: 3.0, ease: "power1.inOut" }, 0.5);

        // Hidden-until-cued rows (set at 0 so seeking back restores them).
        tl.set([q("#ship07-l2"), q("#ship07-l3"), q("#ship07-roll")], { opacity: 0 }, 0);
        tl.set([q("#ship07-c2"), q("#ship07-c3")], { opacity: 0 }, 0);

        const c1 = q("#ship07-c1");
        blink(c1, 0, 0.5, 0.5);

        // Scene 2 (0.5-1.0): first command types on fast.
        tl.set(c1, { opacity: 1 }, 0.5);
        typeOn("#ship07-l1", 0.5, 0.92);
        blink(c1, 0.92, 1.0, 0.16);
        tl.set(c1, { opacity: 0 }, 1.0);

        // Scene 3 (1.0-2.0): ios + android rows, checks snap green, rollout bar fills.
        dropIn("#ship07-ios", 1.0);
        tl.fromTo(q("#ship07-ok1"), { opacity: 0, scale: 0.2, color: "#6d8398" }, { opacity: 1, scale: 1, color: "#5fd89c", duration: 0.2, ease: "back.out(3)" }, 1.18);
        dropIn("#ship07-and", 1.28);
        tl.fromTo(q("#ship07-ok2"), { opacity: 0, scale: 0.2, color: "#6d8398" }, { opacity: 1, scale: 1, color: "#5fd89c", duration: 0.2, ease: "back.out(3)" }, 1.46);
        tl.set(q("#ship07-roll"), { opacity: 1 }, 1.55);
        tl.fromTo(q("#ship07-fill"), { scaleX: 0 }, { scaleX: 0.2, duration: 0.4, ease: "power2.out" }, 1.56);
        const pctEl = q("#ship07-pctnum");
        const pct = { v: 0 };
        tl.fromTo(pct, { v: 0 }, {
          v: 20, duration: 0.4, ease: "power2.out",
          onUpdate: () => { pctEl.textContent = Math.round(pct.v); }
        }, 1.56);

        // Scene 4 (2.0-2.5): second command types on.
        const c2 = q("#ship07-c2");
        tl.set([q("#ship07-l2"), c2], { opacity: 1 }, 2.0);
        typeOn("#ship07-l2", 2.06, 2.38);
        blink(c2, 2.38, 2.5, 0.12);
        tl.set(c2, { opacity: 0 }, 2.5);

        // Scene 5 (2.5-3.5): two results drop in, then a fresh prompt holds with blinking caret.
        dropIn("#ship07-r1", 2.5);
        tl.fromTo(q("#ship07-r1 .ship07-ok"), { scale: 0.2 }, { scale: 1, duration: 0.2, ease: "back.out(3)" }, 2.52);
        dropIn("#ship07-r2", 2.72);
        tl.fromTo(q("#ship07-r2 .ship07-ok"), { scale: 0.2 }, { scale: 1, duration: 0.2, ease: "back.out(3)" }, 2.74);
        const c3 = q("#ship07-c3");
        tl.set(q("#ship07-l3"), { opacity: 1 }, 3.0);
        blink(c3, 3.0, 3.5, 0.4);
        tl.set({}, {}, 3.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["07-ship"] = tl;
      })();
    </script>
  </div>
</template>
