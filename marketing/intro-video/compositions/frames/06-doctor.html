  <script>
    (function () {
      var $ = function (id) { return document.getElementById("f06-doctor-" + id); };
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-0.6): terminal already settled; kicker + per-word h2; command types on ----
      tl.fromTo($("kicker"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
      tl.fromTo($("stub"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.1);
      var words = $("h2").querySelectorAll(".w");
      tl.fromTo(words, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", stagger: 0.055 }, 0.12);

      // Typed command: discrete per-character steps (seek-safe)
      var typed = $("typed");
      var cmd = "appship doctor";
      var chars = [];
      for (var i = 0; i < cmd.length; i++) {
        var s = document.createElement("span");
        s.className = "ch";
        s.textContent = cmd[i];
        typed.appendChild(s);
        chars.push(s);
      }
      chars.forEach(function (c, k) {
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.001 }, 0.08 + k * 0.03);
      });
      // Caret disappears once the command runs
      tl.fromTo($("caret"), { opacity: 1 }, { opacity: 0, duration: 0.001, immediateRender: false }, 0.58);

      // ---- Working theater: finite ASCII spinner, killed the instant the summary lands ----
      var glyphs = $("spin").querySelectorAll(".g");
      tl.fromTo($("spin"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, 0.58);
      var SPIN_START = 0.58, SPIN_END = 2.55, STEP = 0.08;
      var n = 0;
      for (var t = SPIN_START; t < SPIN_END - 0.0001; t += STEP) {
        tl.set(glyphs[n % 4], { opacity: 1 }, t);
        if (n > 0) tl.set(glyphs[(n + 3) % 4], { opacity: 0 }, t);
        n++;
      }
      tl.set($("spin"), { opacity: 0 }, SPIN_END);

      // ---- Scene 2 (0.6-1.85): rows drop in one by one ----
      ["r1", "r2", "r3", "r4", "r5"].forEach(function (id, k) {
        tl.fromTo($(id), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 0.62 + k * 0.25);
      });

      // ---- Scene 3 (2.0-2.55): the failing row flips (scale-swap-transition) ----
      var TRIGGER = 2.0, EXIT_DUR = 0.25, ENTER_DUR = 0.45, OVERLAP = 0.1, EXIT_SCALE = 0.7, BOUNCE = 1.8;
      var ENTER_AT = TRIGGER + EXIT_DUR - OVERLAP;
      // Icon: red cross -> green check at the same center
      tl.fromTo($("x"), { scale: 1, opacity: 1 }, { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in", immediateRender: false }, TRIGGER);
      tl.fromTo($("v"), { scale: EXIT_SCALE, opacity: 0 }, { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "back.out(" + BOUNCE + ")" }, ENTER_AT);
      // Label swap
      tl.fromTo($("tbad"), { scale: 1, opacity: 1 }, { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in", immediateRender: false }, TRIGGER);
      tl.fromTo($("tgood"), { scale: EXIT_SCALE, opacity: 0 }, { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "back.out(" + BOUNCE + ")" }, ENTER_AT);
      // Red bar turns green; red tint shifts to a faint green
      tl.fromTo($("bar"), { backgroundColor: "#ff7a6b" }, { backgroundColor: "#5fd89c", duration: 0.3, ease: "power2.out", immediateRender: false }, TRIGGER + 0.1);
      tl.fromTo($("tint"), { backgroundColor: "rgba(255,122,107,0.10)" }, { backgroundColor: "rgba(95,216,156,0.08)", duration: 0.3, ease: "power2.out", immediateRender: false }, TRIGGER + 0.1);

      // ---- Scene 4 (2.5-3.5): 1px rule draws, summary lands in yellow, holds ----
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 2.5);
      tl.fromTo($("summary"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, SPIN_END);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-doctor"] = tl;
    })();
  </script>
