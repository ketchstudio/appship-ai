# appship.ketchsoft.com: static landing page, files uploaded from website/ by scripts/deploy-website.sh.
# Installed as /etc/nginx/sites-available/appship.ketchsoft.com (symlinked into sites-enabled).
# This is the pre-certbot version; `certbot --nginx` adds the 443/ssl block and the HTTP redirect on the server.
server {
    listen 80;
    server_name appship.ketchsoft.com;

    root /var/www/html/appship;
    index index.html;

    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ =404;
    }

    # CSS/JS file names are not fingerprinted, so keep the cache short.
    location ~* \.(css|js)$ {
        expires 1h;
    }
}
